# Render Blueprint for a private LeadPilot demo: one web service that serves
# both the API and the built React app from the same URL, plus a managed
# PostgreSQL database. In Render: New → Blueprint → pick this repository.
#
# Demo only — see README "Deploying a demo to Render" for the known limits.
databases:
  - name: leadpilot-db
    plan: free
    databaseName: leadpilot
    user: leadpilot

services:
  - type: web
    name: leadpilot
    runtime: node
    plan: free
    branch: main
    # --include=dev: NODE_ENV=production below would otherwise make npm skip
    # TypeScript, Vite and the Prisma CLI, which the build (and the
    # `migrate deploy` at start-up) need.
    buildCommand: >-
      cd client && npm ci --include=dev && VITE_API_URL=/api npm run build &&
      cd ../server && npm ci --include=dev && npm run prisma:generate && npm run build
    # migrate deploy only applies committed migrations that haven't run yet;
    # it never resets or drops data.
    startCommand: cd server && npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: leadpilot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Render puts one proxy in front of the service.
      - key: TRUST_PROXY
        value: "1"
      # Relative to server/, where the start command runs.
      - key: CLIENT_DIST_DIR
        value: ../client/dist
